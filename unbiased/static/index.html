<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unbiased view</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1b1b1b; --muted:#6b6b6b; --line:#e3e1da; --accent:#1f4e79;
          --ok:#2d7a4f; --warn:#b8741a; --bad:#a83232; --primary:#1f4e79; --secondary:#7a7a7a; --opinion:#a83232; }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg) }
  header { padding:18px 24px; border-bottom:1px solid var(--line); background:var(--card); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap }
  header h1 { margin:0; font-size:20px; font-weight:650 }
  header .tag { color:var(--muted); font-size:13px }
  main { display:grid; grid-template-columns:320px 1fr; gap:0; min-height:calc(100vh - 60px) }
  aside { border-right:1px solid var(--line); padding:18px; background:var(--card) }
  section { padding:22px 28px; max-width:1100px }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 3px }
  input, textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff }
  textarea { min-height:90px; resize:vertical }
  button { margin-top:12px; padding:9px 14px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer }
  button:disabled { opacity:.5 }
  .events { margin-top:22px }
  .events a { display:block; padding:8px 6px; border-radius:6px; text-decoration:none; color:var(--ink); font-size:14px }
  .events a:hover, .events a.active { background:#eef2f6 }
  .events small { color:var(--muted); display:block }
  .stats { display:flex; gap:14px; flex-wrap:wrap; margin:10px 0 20px }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 14px; min-width:120px }
  .stat b { display:block; font-size:22px; font-weight:650 }
  .stat span { color:var(--muted); font-size:12px }
  .q { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin:14px 0 }
  .q h3 { margin:0 0 6px; font-size:17px; font-weight:600 }
  .meta { display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--muted); margin-bottom:8px }
  .pill { border:1px solid var(--line); border-radius:999px; padding:2px 9px; background:#faf9f6 }
  .bar { height:8px; background:#ebe9e3; border-radius:4px; overflow:hidden; margin:8px 0 4px }
  .bar i { display:block; height:100% }
  .covered i { background:var(--ok) } .partial i { background:var(--warn) } .none i, .pending i, .searching i, .extracting i { background:var(--bad) }
  .cov { font-size:13px; color:var(--muted) }
  .nosrc { margin:8px 0; padding:8px 10px; border-left:3px solid var(--bad); background:#fbf3f3; font-size:13px }
  .src { border-top:1px solid var(--line); padding:12px 0 6px; margin-top:10px }
  .src .head { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px }
  .cls { font-weight:650; font-size:11px; letter-spacing:.04em; text-transform:uppercase; padding:2px 7px; border-radius:4px; color:#fff }
  .cls.primary { background:var(--primary) } .cls.secondary { background:var(--secondary) } .cls.opinion { background:var(--opinion) }
  .src a.url { color:var(--accent); text-decoration:none; word-break:break-all }
  .limits { font-size:13px; color:var(--muted); margin:4px 0 }
  details { font-size:13px; margin:4px 0 }
  summary { cursor:pointer; color:var(--accent) }
  blockquote { margin:8px 0 8px 10px; padding:8px 12px; border-left:3px solid var(--accent); background:#f7f9fb; font-size:14px }
  blockquote small { display:block; color:var(--muted); margin-top:4px; font-size:12px }
  pre { background:#1b1b1b; color:#eee; padding:12px; border-radius:8px; overflow:auto; font-size:12px; max-height:60vh }
  .empty { color:var(--muted); padding:40px 0 }
  .err { color:var(--bad); font-size:12px; white-space:pre-wrap }
  .live { font-size:12px; color:var(--muted) }
  @media (max-width:800px) { main { grid-template-columns:1fr } aside { border-right:0; border-bottom:1px solid var(--line) } section { padding:16px } }
</style>
</head>
<body>
<header>
  <h1>Unbiased view of an event</h1>
  <span class="tag">questions → sources of truth → verbatim elements. No interpretation. Every decision inspectable.</span>
</header>
<main>
  <aside>
    <form id="form">
      <label>Event</label>
      <input name="title" required value="Manifestation à Paris du samedi 17 octobre 2026">
      <label>Date</label>
      <input name="date" value="2026-10-17">
      <label>Place</label>
      <input name="place" value="Paris, France">
      <label>Context</label>
      <textarea name="description">Demonstration in Paris. One side says the police were violent, the other side says demonstrators broke everything for no reason.</textarea>
      <button id="go">Map the event</button>
    </form>
    <div class="events" id="events"></div>
  </aside>
  <section id="view"><div class="empty">Pick an event or map a new one.</div></section>
</main>
<script>
const $ = s => document.querySelector(s);
let current = null, timer = null;

async function api(path, opts) { const r = await fetch(path, opts); if (!r.ok) throw new Error(path + ' ' + r.status); return r.json(); }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function loadEvents() {
  const evs = await api('/api/events');
  $('#events').innerHTML = evs.map(e => `<a href="#${e.id}" class="${e.id===current?'active':''}">${esc(e.title)}<small>${esc(e.date)} · ${esc(e.status)}</small></a>`).join('') || '<small>No event yet.</small>';
}

$('#form').addEventListener('submit', async ev => {
  ev.preventDefault();
  $('#go').disabled = true;
  const f = new FormData(ev.target);
  const body = Object.fromEntries(f.entries());
  const { id } = await api('/api/events', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
  $('#go').disabled = false;
  location.hash = id;
});

window.addEventListener('hashchange', () => show(location.hash.slice(1)));

async function show(id) {
  current = id; clearInterval(timer);
  await render(id);
  loadEvents();
  timer = setInterval(async () => { const t = await render(id); if (['done','failed'].includes(t.progress.stage)) { clearInterval(timer); loadEvents(); } }, 4000);
}

async function render(id) {
  const t = await api('/api/events/' + id);
  const p = t.progress, s = t.stats;
  const running = !['done','failed'].includes(p.stage);
  $('#view').innerHTML = `
    <h2 style="margin:0">${esc(t.event.title)}</h2>
    <div class="live">${esc(t.event.date)} · ${esc(t.event.place)} · mapped ${esc(t.event.created_at)} · ${running ? 'live run: ' + esc(p.stage) + ' ' + p.done + '/' + p.total : esc(p.stage)}</div>
    ${p.errors?.length ? `<div class="err">${esc(p.errors.join('\n'))}</div>` : ''}
    <div class="stats">
      <div class="stat"><b>${s.questions}</b><span>questions</span></div>
      <div class="stat"><b>${s.covered}</b><span>covered</span></div>
      <div class="stat"><b>${s.partial}</b><span>partial</span></div>
      <div class="stat"><b>${s.none}</b><span>no source of truth</span></div>
      <div class="stat"><b>${s.avg_coverage}%</b><span>avg coverage</span></div>
      <div class="stat"><b>${s.primary_sources}</b><span>primary sources</span></div>
      <div class="stat"><b>${s.elements}</b><span>verbatim elements</span></div>
    </div>
    ${t.questions.map(question).join('') || (running ? '<div class="empty">Finding the questions…</div>' : '')}
    <div id="trace"></div>`;
  return t;
}

function question(q) {
  return `<div class="q ${q.status}">
    <h3>${esc(q.text)}</h3>
    <div class="meta"><span class="pill">bias axis: ${esc(q.bias_axis)}</span><span class="pill">ground truth: ${esc(q.truth_kind.replace('_',' '))}</span><span>${esc(q.why_contested)}</span></div>
    <div class="bar"><i style="width:${q.coverage}%"></i></div>
    <div class="cov">${q.coverage}% of the question covered by primary sources · ${esc(q.status)} ${q.run_id ? `· <a href="#" onclick="trace('${q.run_id}');return false">how the sources were chosen</a>` : ''}</div>
    ${q.no_source_reason ? `<div class="nosrc">No source of truth: ${esc(q.no_source_reason)}</div>` : ''}
    ${q.sources.map(source).join('')}
  </div>`;
}

function source(s) {
  return `<div class="src">
    <div class="head"><span class="cls ${s.class}">${s.class}</span><b>${esc(s.holder)}</b><span>· covers ${s.coverage}%</span><span>· ${esc(s.published_at || 'undated')}</span></div>
    <a class="url" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a>
    <div class="limits">Limits: ${esc(s.limits)}</div>
    <details><summary>why this class</summary>${esc(s.reasoning)} <a href="#" onclick="domain('${esc(s.domain)}');return false">· this domain on other questions</a></details>
    ${s.elements.map(e => `<blockquote>${esc(e.verbatim)}<small>${esc(e.locator)} ${e.published_at ? '· ' + esc(e.published_at) : ''} ${e.note ? '· ' + esc(e.note) : ''} ${e.run_id ? `· <a href="#" onclick="trace('${e.run_id}');return false">trace</a>` : ''}</small></blockquote>`).join('')}
    ${s.class === 'primary' && !s.elements.length ? '<div class="limits">No element extracted yet.</div>' : ''}
  </div>`;
}

async function trace(runId) {
  const r = await api('/api/runs/' + runId);
  $('#trace').innerHTML = `<h3>Trace ${esc(r.run.kind)} · ${esc(r.run.model)} · ${esc(r.run.status)} · ${r.run.tool_calls} tool calls</h3><pre>${esc(JSON.stringify(r.events, null, 1))}</pre>`;
  $('#trace').scrollIntoView({ behavior:'smooth' });
}

async function domain(d) {
  const rows = await api('/api/domains/' + encodeURIComponent(d));
  $('#trace').innerHTML = `<h3>${esc(d)} across questions</h3><pre>${esc(JSON.stringify(rows, null, 1))}</pre>`;
  $('#trace').scrollIntoView({ behavior:'smooth' });
}

loadEvents();
if (location.hash.length > 1) show(location.hash.slice(1));
</script>
</body>
</html>
